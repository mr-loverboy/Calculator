<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuromi Calculator</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

        /* --- THEME COLORS --- */
        :root {
            --kuromi-purple-bg: #8e44ad; 
            --kuromi-purple-body: #9b59b6;
            --kuromi-dark: #2c2c2c;
            --kuromi-pink: #ff99cc;
            --kuromi-yellow: #fff68f;
            --text-light: #ffffff;
            --display-bg: #fdf1f7; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0; 
            padding: 0;
            height: 100vh; 
            width: 100vw;
            display: flex; justify-content: center; align-items: center;
            background-color: var(--kuromi-purple-bg);
            overflow: hidden; 
        }

        /* Binalik ko ang Container para may space sa dulo */
        .calculator-container {
            width: 100%;
            /* Ito ang naglilimit para di sagad sa gilid ng phone */
            max-width: 360px; 
            /* Ito naglilimit sa taas para di sagad sa top/bottom */
            height: auto;
            max-height: 90vh; /* 90% lang ng height ng phone para may space */
            
            background: rgba(44, 44, 44, 0.5);
            /* Ito ang space sa loob ng dark glass */
            padding: 15px; 
            border-radius: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            
            /* Margin para sure na may space sa maliliit na phone */
            margin: 20px;
        }

        .calculator-body {
            background-color: var(--kuromi-purple-body);
            padding: 15px; 
            border-radius: 25px;
            border: 2px solid #7d3f96; 
            flex-grow: 1; 
            display: flex; flex-direction: column;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        /* --- SCREEN AREA --- */
        .display-area {
            background-color: var(--display-bg);
            border: 4px solid var(--kuromi-pink);
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.1);
            border-radius: 20px;
            margin-bottom: 15px;
            
            /* Responsive height pero fixed range */
            height: 110px;
            min-height: 100px;
            
            position: relative; 
            overflow: hidden; 
            display: flex; align-items: center;
            padding: 0 15px;
            transform: translateZ(0);
        }

        /* --- KUROMI ANIMATION (PABALIK-BALIK) --- */
        .kuromi-walker {
            position: absolute;
            bottom: 0px; 
            left: 0;
            height: 75px; /* Fixed height para di ma-stretch */
            width: auto;
            z-index: 1; 
            pointer-events: none; 
            mix-blend-mode: multiply; 
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            will-change: transform;
            animation: walk-cycle 12s linear infinite;
        }

        @keyframes walk-cycle {
            0%   { transform: translate3d(-80px, 0, 0) scaleX(1); }
            45%  { transform: translate3d(280px, 0, 0) scaleX(1); } /* Adjusted distance para sa container size */
            45.1% { transform: translate3d(280px, 0, 0) scaleX(-1); }
            95%  { transform: translate3d(-80px, 0, 0) scaleX(-1); }
            95.1% { transform: translate3d(-80px, 0, 0) scaleX(1); }
            100% { transform: translate3d(-80px, 0, 0) scaleX(1); }
        }

        #display-text {
            position: relative;
            color: var(--kuromi-dark);
            font-size: 3.5rem; 
            font-weight: 600;
            z-index: 2;
            width: 100%;
            text-align: right; 
        }

        /* --- BUTTONS --- */
        .buttons-grid {
            display: grid; 
            grid-template-columns: repeat(4, 1fr);
            gap: 12px; 
            flex-grow: 1; 
            padding: 5px;
        }

        .btn {
            border: none; border-radius: 50%;
            font-size: 1.5rem; font-weight: 600; cursor: pointer;
            background-color: var(--kuromi-dark); color: var(--text-light);
            box-shadow: 0 5px #1a1a1a; transition: transform 0.1s;
            touch-action: manipulation; 
            aspect-ratio: 1/1; /* Panatilihing bilog */
            display: flex; justify-content: center; align-items: center;
        }
        .btn:active { box-shadow: 0 2px #1a1a1a; transform: translateY(3px); }
        .number { background-color: var(--kuromi-dark); }
        .operator { background-color: #4a3b52; font-size: 1.8rem; }
        .func-btn { background-color: var(--kuromi-pink); color: var(--kuromi-dark); box-shadow: 0 5px #d683ad; }
        .func-btn:active { box-shadow: 0 2px #d683ad; }
        .equals-btn {
            background-color: var(--kuromi-yellow); color: var(--kuromi-dark);
            box-shadow: 0 5px #e6de80; grid-column: span 2;
            border-radius: 25px; aspect-ratio: auto;
        }
        .equals-btn:active { box-shadow: 0 2px #e6de80; }
        .backspace-btn { font-size: 1.4rem; }

        /* Media query para siguruhing fit kahit sa maliliit na android/iphone */
        @media (max-width: 360px) {
            .calculator-container { margin: 10px; padding: 10px; }
            .btn { font-size: 1.2rem; gap: 8px; }
            .kuromi-walker { height: 60px; }
            #display-text { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="calculator-body">
            
            <div class="display-area">
                <img src="tenor.gif" class="kuromi-walker" alt="Kuromi">
                <div id="display-text">0</div>
            </div>

            <div class="buttons-grid">
                <button class="btn operator func-btn" data-action="clear">C</button>
                <button class="btn operator" data-action="/">÷</button>
                <button class="btn operator" data-action="*">×</button>
                <button class="btn operator backspace-btn" data-action="backspace">⌫</button>
                <button class="btn number">7</button>
                <button class="btn number">8</button>
                <button class="btn number">9</button>
                <button class="btn operator" data-action="-">-</button>
                <button class="btn number">4</button>
                <button class="btn number">5</button>
                <button class="btn number">6</button>
                <button class="btn operator" data-action="+">+</button>
                <button class="btn number">1</button>
                <button class="btn number">2</button>
                <button class="btn number">3</button>
                <button class="btn number zero-btn">0</button>
                <button class="btn number">.</button>
                <button class="btn equals-btn" data-action="=">=</button>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById('display-text');
        const buttons = document.querySelectorAll('.btn');
        
        let currentString = "0";
        const hugotLine = "AKO PA BA? O MAY IBA NA";

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                if (navigator.vibrate) navigator.vibrate(35);

                const action = button.dataset.action;
                const buttonText = button.textContent;

                if (action === '=') {
                    currentString = hugotLine;
                } else if (action === 'clear') {
                    currentString = "0";
                } else if (action === 'backspace') {
                    if (currentString === hugotLine || currentString.length === 1) {
                        currentString = "0";
                    } else {
                        currentString = currentString.slice(0, -1);
                    }
                } else {
                    if (currentString === "0" || currentString === hugotLine) {
                         currentString = buttonText;
                    } else {
                        currentString += buttonText;
                    }
                }

                updateDisplay();
            });
        });

        function updateDisplay() {
            display.textContent = currentString;
            
            if (currentString === hugotLine) {
                // MALAKING FONT at CENTER para sa Hugot
                display.style.fontSize = "1.8rem"; 
                display.style.fontWeight = "700";
                display.style.whiteSpace = "normal"; 
                display.style.textAlign = "center"; 
                display.style.lineHeight = "1.1"; 
            } else {
                display.style.whiteSpace = "nowrap";
                display.style.textAlign = "right"; 
                display.style.lineHeight = "normal";
                display.style.fontWeight = "600";
                
                if (currentString.length > 8) {
                    display.style.fontSize = "2.2rem";
                } else {
                    display.style.fontSize = "3.5rem";
                }
            }
        }
    </script>
</body>
</html>
